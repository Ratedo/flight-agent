services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight-demo-local}
      POSTGRES_DB: flights
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flights -d flights']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
  agent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: flights
      PGPASSWORD: ${POSTGRES_PASSWORD:-flight-demo-local}
      PGDATABASE: flights
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: qwen3.5:4b-q4_K_M
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      PASSPORT_KEY_FILE: /var/lib/flight-agent/passport.key
    volumes:
      - agent_data:/var/lib/flight-agent
    stdin_open: true
    tty: true
volumes:
  postgres_data:
  agent_data:
